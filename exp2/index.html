<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        nav li {
            margin-left: 1rem;
        }

        nav a {
            color: #fff;
            text-decoration: none;
        }

        main {
            padding: 1rem;
            display: flex;
            flex-wrap: wrap;
        }

        .product {
            border: 1px solid #ccc;
            padding: 1rem;
            margin: 1rem;
            width: 200px;
            text-align: center;
        }

        .product img {
            max-width: 100%;
            height: auto;
        }

        .cart {
            flex: 1;
            margin-left: 1rem;
            padding: 1rem;
            border: 1px solid #ccc;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .cart-total {
            font-weight: bold;
            margin-top: 1rem;
        }
        #catalog{
            display: flex;
            flex-wrap: wrap;
        }
    </style>
</head>
