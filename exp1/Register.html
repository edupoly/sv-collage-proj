<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        

        header {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        nav li {
            margin-left: 1rem;
        }

        nav a {
            color: #fff;
            text-decoration: none;
        }

        main {
            padding: 1rem;
            display: flex;
            flex-wrap: wrap;
        }

        .product {
            border: 1px solid #ccc;
            padding: 1rem;
            margin: 1rem;
            width: 200px;
            text-align: center;
        }

        .product img {
            max-width: 100%;
            height: auto;
        }

        .cart {
            flex: 1;
            margin-left: 1rem;
            padding: 1rem;
            border: 1px solid #ccc;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .cart-total {
            font-weight: bold;
            margin-top: 1rem;
        }
        #catalog{
            display: flex;
            flex-wrap: wrap;
        }
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        .container { 
      background-color: #fff;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    </style>
</head>
<body>

    <header>
        <h1>My Shopping Cart</h1>
        <nav>
            <ul>
                <li><a href="catalog.html">Home</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>



    <div class="container"> 
        <h2>Register</h2>
        <form>
          <input type="text" id="username" placeholder="Username" required><br>
          <input type="email" id="email" placeholder="Email" required><br>
          <input type="password" id="password" placeholder="Password" required><br>
          <input type="password" id="confirmPassword" placeholder="Confirm Password" required><br>
          <button type="submit">Register</button>
        </form>
      </div>
        


    </body>
</html>
