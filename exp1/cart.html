<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        nav li {
            margin-left: 1rem;
        }

        nav a {
            color: #fff;
            text-decoration: none;
        }

        main {
            padding: 1rem;
            display: flex;
            flex-wrap: wrap;
        }

        .product {
            border: 1px solid #ccc;
            padding: 1rem;
            margin: 1rem;
            width: 200px;
            text-align: center;
        }

        .product img {
            max-width: 100%;
            height: auto;
        }

        .cart {
            flex: 1;
            margin-left: 1rem;
            padding: 1rem;
            border: 1px solid #ccc;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .cart-total {
            font-weight: bold;
            margin-top: 1rem;
        }
        #catalog{
            display: flex;
            flex-wrap: wrap;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            }
            th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            }
            th {
            background-color: #f2f2f2;
            }
    </style>
</head>
<body>

    <header>
        <h1>My Shopping Cart</h1>
        <nav>
            <ul>
                <li><a href="catalog.html">Home</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Cart</h2>
        <h1>Shopping Cart</h1>

  <table>
    <thead>
      <tr>
        <th>Product</th>
        <th>Quantity</th>
        <th>Price</th>
        <th>Subtotal</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Product A</td>
        <td>1</td>
        <td>$10.00</td>
        <td>$10.00</td>
      </tr>
      <tr>
        <td>Product B</td>
        <td>2</td>
        <td>$15.00</td>
        <td>$30.00</td>
      </tr>
      <tr>
        <td>Product C</td>
        <td>1</td>
        <td>$20.00</td>
        <td>$20.00</td>
      </tr>
    </tbody>
  </table>

  <p><b>Total: $60.00</b></p>

  <button>Pay Now</button>

        </main>

    </body>
</html>
